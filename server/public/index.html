<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1><span class="title-coral">Chat</span><span class="title-purple">Room</span></h1>
    <div class="title-divider">
      <span class="line coral"></span>
      <span class="line purple"></span>
    </div>
    <div class="messages-wrap">
      <img class="phone-decor phone-decor-coral" src="images/handset-coral.png" alt="" aria-hidden="true">
      <div id="messages"></div>
      <img class="phone-decor phone-decor-purple" src="images/phone-purple.png" alt="" aria-hidden="true">
    </div>
    <form id="messageForm">
      <input id="nameInput" type="text" placeholder="Your name" required>
      <input id="textInput" type="text" placeholder="Message" required>
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="main.js"></script>
</body>
</html>
